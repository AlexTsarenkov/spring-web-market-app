spring.application.name=payment-service

# Контекст как в payment-api.yaml (порт при необходимости поменяйте и в servers в спецификации)
server.port=8081
spring.webflux.base-path=/payment/v1

# JWT validation for incoming Bearer tokens from web-market
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/web-market-app