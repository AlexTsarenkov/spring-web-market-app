<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Вход | Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="text-center mb-4">
                <h2>
                    <span class="badge text-bg-success">Витрина магазина</span>
                </h2>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-3 text-center">Вход в аккаунт</h4>

                    <div class="alert alert-success" role="alert" th:if="${isLogout}">
                        Вы успешно вышли из системы.
                    </div>

                    <p class="text-muted text-center mb-4">
                        Вход выполняется через сервер авторизации Keycloak.
                    </p>

                    <div class="d-grid">
                        <a class="btn btn-success" href="/oauth2/authorization/keycloak">
                            Войти через Keycloak
                        </a>
                    </div>
                </div>
                <div class="card-footer text-center bg-white">
                    <a th:href="@{/items}" class="btn btn-outline-secondary btn-sm bi bi-arrow-left-square"> На витрину</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
